apiVersion: v1
kind: ServiceAccount
metadata: {name: chaos-runner, namespace: sample-api-dev}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: chaos-runner, namespace: sample-api-dev}
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: chaos-runner, namespace: sample-api-dev}
subjects:
- kind: ServiceAccount
  name: chaos-runner
  namespace: sample-api-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-runner
---
apiVersion: batch/v1
kind: Job
metadata: {name: delete-sample-api-pod, namespace: sample-api-dev}
spec:
  template:
    spec:
      serviceAccountName: chaos-runner
      restartPolicy: Never
      containers:
      - name: kubectl
        image: alpine/kubectl:1.36.2
        command:
        - sh
        - -c
        - |
          POD="$(kubectl get pod -l app.kubernetes.io/name=sample-api -o jsonpath='{.items[0].metadata.name}')"
          echo "Deleting pod ${POD}"
          kubectl delete pod "$POD" --wait=false
