apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.7.1"
    helm:
      releaseName: karpenter
      values: |
        controller:
          env:
            - name: AWS_REGION
              value: eu-north-1
        replicas: 1
        settings:
          clusterName: solab-shared
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
