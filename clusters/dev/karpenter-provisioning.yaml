apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-provisioning
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/steoli-platform-labs/platform-config.git
    targetRevision: main
    path: addons/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
