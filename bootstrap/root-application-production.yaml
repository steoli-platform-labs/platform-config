apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/steoli-platform-labs/platform-config.git
    targetRevision: main
    path: clusters/production
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
